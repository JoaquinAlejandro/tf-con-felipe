name: 'Terraform Azure OIDC CI/CD'

on:
  pull_request:
    branches:
      - main
    paths:
      - 'AZURE/**'
  workflow_dispatch:
    inputs:
      confirmar_apply:
        description: 'Escribe "yes" para confirmar la creación de recursos'
        required: true
        default: 'no'

# Permiso a GitHub para pedir el token JWT a Azure.
permissions:
  id-token: write 
  contents: read

# Se inyectan IDs publicos 
env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC: true # Autenticacion sin contraseña de terraform

jobs:
  terraform-plan:
    name: 'Build y Plan'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ./AZURE
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      # Autenticación segura vía Azure Login Action usando OIDC
      - name: 'Az CLI login con OIDC'
        uses: azure/login@v1
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Guardar Plan como Artefacto
        uses: actions/upload-artifact@v3
        with:
          name: reporte-plan-azure
          path: ./AZURE/tfplan

  terraform-apply:
    name: 'Apply Manual'
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirmar_apply == 'yes'
    defaults:
      run:
        working-directory: ./AZURE
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      - name: 'Az CLI login con OIDC'
        uses: azure/login@v1
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
