# =============================================================================
# Terraform Azure OIDC CI/CD — Pipeline completo
# =============================================================================
#
# Flujo:
#   PR → Validate (fmt + validate + trivy) → comentario en PR
#   Push a main o manual (plan) → Plan → guarda en Azure Storage (pending-plans, TTL 1d)
#   Dispatch (apply)  → descarga último plan de pending-plans → apply → mueve a applied-plans
#   Dispatch (destroy) → destroy
#
# Prerrequisitos:
#   1. Ejecutar BOOTSTRAP/ una vez (crea Storage Account, containers, RBAC y lifecycle policy)
#   2. Agregar secrets: AZURE_CLIENT_ID, AZURE_SUBSCRIPTION_ID, AZURE_TENANT_ID,
#      AZURE_STORAGE_ACCOUNT_NAME, AZURE_STORAGE_CONTAINER_PENDING_NAME,
#      AZURE_STORAGE_CONTAINER_APPLIED_NAME
# =============================================================================

name: 'Terraform Azure OIDC CI/CD'

on:
  push:
    branches:
      - main
    paths:
      - 'AZURE/**'
  pull_request:
    branches:
      - main
    paths:
      - 'AZURE/**'
  workflow_dispatch:
    inputs:
      accion:
        description: '¿Qué acción ejecutar?'
        required: true
        type: choice
        options:
          - 'plan'
          - 'apply'
          - 'destroy'
        default: 'plan'

# Permiso a GitHub para pedir el token JWT a Azure (OIDC)
permissions:
  id-token: write
  contents: read
  pull-requests: write   # Necesario para publicar comentario en el PR

# Secrets inyectados como variables de entorno
env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC: true

# =============================================================================
# Job 1: Validate — se ejecuta en cada PR (solo validación, sin plan)
# =============================================================================
jobs:
  Validate:
    name: 'Validate'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ./AZURE

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: 'Az CLI login con OIDC'
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform fmt (validar formato)
        run: |
          terraform fmt -recursive
          git diff --exit-code

      - name: Terraform Validate
        run: terraform validate

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          trivyignores: .trivyignore

      - name: Resultado de validación
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ Validación exitosa\n\n- terraform fmt: ✅\n- terraform validate: ✅\n- trivy (security scan): ✅\n\n> Para generar un plan, mergeá este PR a \`main\` o ejecutá manual \`plan\` desde Actions.`
            });

# =============================================================================
# Job 2: Plan — se ejecuta en push a main o manualmente vía workflow_dispatch
# =============================================================================
  Plan:
    name: 'Plan'
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.accion == 'plan')
    defaults:
      run:
        working-directory: ./AZURE

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: 'Az CLI login con OIDC'
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform fmt (validar formato)
        run: |
          terraform fmt -recursive
          git diff --exit-code

      - name: Terraform Validate
        run: terraform validate

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          trivyignores: .trivyignore

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -out=tfplan -no-color 2>&1 | tee plan-output.txt
          echo "PLAN_EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Guardar Plan en Azure Storage (pending-plans)
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          BLOB_NAME="tfplan-${TIMESTAMP}.plan"

          az storage blob upload \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }} \
            --container-name ${{ secrets.AZURE_STORAGE_CONTAINER_PENDING_NAME }} \
            --name "${BLOB_NAME}" \
            --file ./tfplan \
            --auth-mode login

          echo "✅ Plan guardado en Azure Storage (pending-plans): ${BLOB_NAME}"
          echo "## 📦 Plan pendiente de aplicar" >> $GITHUB_STEP_SUMMARY
          echo "\`${BLOB_NAME}\` (TTL: 1 día)" >> $GITHUB_STEP_SUMMARY

# =============================================================================
# Job 2: Apply — se ejecuta manualmente vía workflow_dispatch
# =============================================================================
  Apply:
    name: 'Apply'
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.accion == 'apply'
    defaults:
      run:
        working-directory: ./AZURE

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: 'Az CLI login con OIDC'
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Descargar último plan de Azure Storage (pending-plans)
        id: download
        run: |
          echo "🔍 Buscando el último plan en pending-plans..."

          # Listar blobs ordenados por fecha de modificación (más reciente primero)
          LATEST_BLOB=$(az storage blob list \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }} \
            --container-name ${{ secrets.AZURE_STORAGE_CONTAINER_PENDING_NAME }} \
            --auth-mode login \
            --query "sort_by([], &properties.lastModified)[-1].name" \
            --output tsv)

          if [ -z "${LATEST_BLOB}" ] || [ "${LATEST_BLOB}" = "None" ]; then
            echo "============================================"
            echo "  ❌ No hay planes pendientes"
            echo "============================================"
            echo ""
            echo "Ejecutá un push a main o un Plan manual para generar un plan."
            exit 1
          fi

          echo "📥 Descargando: ${LATEST_BLOB}"
          az storage blob download \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }} \
            --container-name ${{ secrets.AZURE_STORAGE_CONTAINER_PENDING_NAME }} \
            --name "${LATEST_BLOB}" \
            --file ./tfplan \
            --auth-mode login

          # Guardar el nombre del blob para usarlo después (mover a applied-plans)
          echo "PENDING_BLOB_NAME=${LATEST_BLOB}" >> $GITHUB_ENV
          echo "✅ Plan descargado: ${LATEST_BLOB}"

      - name: Terraform Apply
        run: terraform apply tfplan

      - name: Publicar Outputs en Job Summary
        run: |
          echo "## 📤 Terraform Outputs" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          terraform output -json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Mover plan a historial (applied-plans)
        if: success()
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          APPLIED_BLOB_NAME="tfplan-applied-${TIMESTAMP}.plan"

          # Subir una copia a applied-plans (histórico permanente)
          az storage blob upload \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }} \
            --container-name ${{ secrets.AZURE_STORAGE_CONTAINER_APPLIED_NAME }} \
            --name "${APPLIED_BLOB_NAME}" \
            --file ./tfplan \
            --auth-mode login

          # Eliminar el plan original de pending-plans
          az storage blob delete \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }} \
            --container-name ${{ secrets.AZURE_STORAGE_CONTAINER_PENDING_NAME }} \
            --name "${PENDING_BLOB_NAME}" \
            --auth-mode login

          echo "✅ Plan movido a historial: ${APPLIED_BLOB_NAME}"
          echo "## 📦 Plan aplicado y archivado" >> $GITHUB_STEP_SUMMARY
          echo "\`${APPLIED_BLOB_NAME}\`" >> $GITHUB_STEP_SUMMARY

# =============================================================================
# Job 3: Destroy — se ejecuta manualmente vía workflow_dispatch
# =============================================================================
  Destroy:
    name: 'Destroy'
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.accion == 'destroy'
    defaults:
      run:
        working-directory: ./AZURE

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: 'Az CLI login con OIDC'
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
